
[functions.admin-system-health]
enabled = true
verify_jwt = false
import_map = "./functions/admin-system-health/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-system-health/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-system-health/*.html" ]

# Le webhook est appelé par FedaPay sans jeton Supabase : il est protégé par signature.
[functions.fedapay-webhook]
verify_jwt = false
