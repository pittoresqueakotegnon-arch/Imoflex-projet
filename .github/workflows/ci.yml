name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build
      env:
        # Décommentez et ajoutez ces secrets dans GitHub Settings > Secrets
        # si votre build Vite en a besoin :
        # VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        # VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        NODE_ENV: production

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run E2E Tests
      run: npm run test:e2e
